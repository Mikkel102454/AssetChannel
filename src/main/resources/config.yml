# Pack hosting overrides require a restart.
# overrides:
#   pack:
#     host: 127.0.0.1
#     port: 25566

# Settings used only by soundtracks with auto-split enabled.
music:
  ffmpeg:
    # "bundled" uses the executable shipped inside AssetChannel.
    executable: bundled
    timeout-seconds: 300
    # Vorbis variable-quality scale: 0 (smallest) to 10 (highest). Six is a good music default.
    vorbis-quality: 6
  playback:
    # Starts adjacent synchronized clips slightly early to mask client/tick and decoder latency.
    # Individual stages can override this at playback.handoff-lead-milliseconds.
    handoff-lead-milliseconds: 75
    # Reassert vanilla-music muting without sending a large stop list at every short clip boundary.
    vanilla-mute-refresh-seconds: 30
