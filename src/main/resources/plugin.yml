name: AssetChannel
version: '${version}'

main: nu.miguel.assetChannel.Main
api-version: '26.3'
load: POSTWORLD

permissions:
  assetchannel.blocks.place:
    description: Allows placing AssetChannel block items (normal protection events still apply)
    default: true
  assetchannel.command.test:
    description: Allows AssetChannel operator commands
    default: op
